server.port=8081
spring.application.name=localbite-group-a

spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false

jwt.secret=${JWT_SECRET}
jwt.expiration-ms=86400000

services.auth.url=${SERVICES_AUTH_URL:http://localhost:8081}
services.user.url=${SERVICES_USER_URL:http://localhost:8081}
services.seller.url=${SERVICES_SELLER_URL:http://localhost:8081}
services.admin.url=${SERVICES_ADMIN_URL:http://localhost:8081}

services.food.url=${SERVICES_FOOD_URL:http://localhost:8084}
services.cart.url=${SERVICES_CART_URL:http://localhost:8084}
services.order.url=${SERVICES_ORDER_URL:http://localhost:8084}

services.payment.url=${SERVICES_PAYMENT_URL:http://localhost:8088}
services.wallet.url=${SERVICES_WALLET_URL:http://localhost:8088}
services.commission.url=${SERVICES_COMMISSION_URL:http://localhost:8088}

services.delivery.url=${SERVICES_DELIVERY_URL:http://localhost:8091}
services.review.url=${SERVICES_REVIEW_URL:http://localhost:8091}
services.invoice.url=${SERVICES_INVOICE_URL:http://localhost:8091}
services.notification.url=${SERVICES_NOTIFICATION_URL:http://localhost:8091}
services.location.url=${SERVICES_LOCATION_URL:http://localhost:8091}