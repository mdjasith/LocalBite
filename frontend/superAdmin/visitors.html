<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Visitors — LocalBite Admin</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/global.css" />
  <link rel="stylesheet" href="css/layout.css" />
  <link rel="stylesheet" href="css/components.css" />
</head>
<body>
  <div id="app">
    <div class="page-header">
      <h1>Visitor monitoring</h1>
      <p>Track visits, logins, registrations, and location of every visitor.</p>
    </div>

    <div class="stat-grid" id="stats"></div>

    <div class="section-title" style="margin: 32px 0 16px;">Top countries (last 30 days)</div>
    <div class="table-wrap" id="countryWrap"></div>

    <div class="section-title" style="margin: 32px 0 16px;">Top cities (last 30 days)</div>
    <div class="table-wrap" id="cityWrap"></div>

    <div class="section-title" style="margin: 32px 0 16px;">Recent logins</div>
    <div class="table-wrap" id="loginsWrap"></div>

    <div class="section-title" style="margin: 32px 0 16px;">All recent activity</div>
    <div class="table-wrap" id="recentWrap"></div>
  </div>
  <script src="js/config.js"></script>
  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/layout.js"></script>
  <script>if (requireAdmin()) renderShell('visitors', 'Visitors')</script>
  <script src="js/visitors.js"></script>
</body>
</html>
