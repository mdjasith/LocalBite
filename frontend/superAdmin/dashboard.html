<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Dashboard — LocalBite Admin</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/global.css" />
  <link rel="stylesheet" href="css/layout.css" />
  <link rel="stylesheet" href="css/components.css" />
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
</head>
<body>
  <div id="app">
    <div class="page-header">
      <h1>Dashboard</h1>
      <p>Platform overview — sellers, orders, GMV, and commission.</p>
    </div>

    <div class="stat-grid" id="stats"></div>

    <div class="grid-2" style="margin-bottom: 32px;">
      <div class="chart-card">
        <div class="chart-card__title">Orders per day (last 7 days)</div>
        <div class="chart-card__body"><canvas id="ordersChart"></canvas></div>
      </div>
      <div class="chart-card">
        <div class="chart-card__title">Order status distribution</div>
        <div class="chart-card__body"><canvas id="statusChart"></canvas></div>
      </div>
    </div>

    <div class="section-title" style="margin-bottom: 16px;">
      Pending seller applications
      <a href="sellers.html" style="font-size: 13px; font-weight: 600;">View all →</a>
    </div>
    <div class="table-wrap" id="pendingSellersWrap"></div>

    <div class="section-title" style="margin: 32px 0 16px;">
      Recent orders
      <a href="orders.html" style="font-size: 13px; font-weight: 600;">View all →</a>
    </div>
    <div class="table-wrap" id="recentOrdersWrap"></div>
  </div>

  <script src="js/config.js"></script>
  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/layout.js"></script>
  <script>
    if (requireAdmin()) {
      renderShell('dashboard', 'Dashboard')
    }
  </script>
  <script src="js/dashboard.js"></script>
</body>
</html>
