<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Analytics — LocalBite Admin</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/global.css" />
  <link rel="stylesheet" href="css/layout.css" />
  <link rel="stylesheet" href="css/components.css" />
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
</head>
<body>
  <div id="app">
    <div class="page-header">
      <h1>Analytics</h1>
      <p>Aggregate performance metrics (simulated).</p>
    </div>
    <div class="grid-2" style="margin-bottom:32px;">
      <div class="chart-card">
        <div class="chart-card__title">Revenue per day (last 7 days)</div>
        <div class="chart-card__body"><canvas id="revChart"></canvas></div>
      </div>
      <div class="chart-card">
        <div class="chart-card__title">Top 5 sellers by earnings</div>
        <div class="chart-card__body"><canvas id="sellerChart"></canvas></div>
      </div>
    </div>
  </div>
  <script src="js/config.js"></script>
  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/layout.js"></script>
  <script>if (requireAdmin()) renderShell('analytics', 'Analytics')</script>
  <script src="js/analytics.js"></script>
</body>
</html>
